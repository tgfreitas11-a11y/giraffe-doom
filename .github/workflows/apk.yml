name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Marcar a versão
        run: |
          N=$(git rev-list --count HEAD)
          echo "GD_BUILD=$((N + 100))" >> $GITHUB_ENV
          echo "window.GD_VERSION = '$N · $(TZ=America/Sao_Paulo date +%d/%m/%Y)';" > www/version.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o jogo para o projeto Android
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log

      - name: Publicar o APK em "Releases"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GiraffeDoom.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima GiraffeDoom.apk \
            --title "Giraffe Doom (última versão)" \
            --notes "Toque em GiraffeDoom.apk no celular para baixar e instalar."

      - name: Guardar o registro do erro
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 200 build.log > erro-compilacao.txt || echo "sem registro" > erro-compilacao.txt
          gh release delete erro --yes --cleanup-tag || true
          gh release create erro erro-compilacao.txt --prerelease --title "Erro na última compilação" --notes "Registro do erro"
