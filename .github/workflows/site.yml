name: Publicar site (iPhone e navegador)

on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Marcar a versão
        run: |
          N=$(git rev-list --count HEAD)
          echo "GD_BUILD=$((N + 100))" >> $GITHUB_ENV
          echo "window.GD_VERSION = '$N · $(TZ=America/Sao_Paulo date +%d/%m/%Y)';" > www/version.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
