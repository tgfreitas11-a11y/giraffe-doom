<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Giraffe Doom</title>
<meta name="theme-color" content="#140c09">
<style>
@font-face{font-family:"Michroma";font-weight:400;font-display:swap;src:url(fonts/michroma-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-weight:400;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-weight:500;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-700-normal.woff2) format("woff2")}
</style>
<style>
/* Layout: mesa de jogo em tela única — adversários no topo, sua mesa no centro, vitrine + mão fixas embaixo */
:root {
  --felt: #1d1411; --felt-2: #2a1c16; --panel: #33231b; --line: #4e372a;
  --bronze: #c8913f; --bronze-dim: #8a6430; --ember: #e0462c; --bone: #efe6d6; --muted: #a9978a;
  --good: #6fbf73;
  --c-R: #d9483b; --c-B: #4a86dc; --c-G: #45a161; --c-Y: #e3b53b; --c-W: #ebe5da;
  --f-display: "Michroma", "Eurostile", "Arial Black", sans-serif;
  --f-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --card-w: 76px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--felt); color: var(--bone); font-family: var(--f-body); font-size: 15px; overflow: hidden;
  background-image: radial-gradient(120% 60% at 50% 35%, var(--felt-2), var(--felt) 70%); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .card:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }
h1, h2, h3, .disp { font-family: var(--f-display); font-weight: 400; letter-spacing: .04em; text-wrap: balance; }

/* topo */
.top { display: flex; align-items: center; gap: 8px; padding: 8px 16px 4px; }
.top .logo { flex: 1; min-width: 0; }
.top .logo img { display: block; height: 30px; width: auto; max-width: 100%; }
.iconbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
.score-pill { font-variant-numeric: tabular-nums; }

/* adversários */
.foes { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 8px; scrollbar-width: none; }
.foe { flex: 0 0 auto; min-width: 118px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; text-align: left; display: grid; gap: 3px; }
.foe.turn { border-color: var(--bronze); box-shadow: 0 0 0 1px var(--bronze) inset; }
.foe .nm { font-weight: 700; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.foe .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.foe .tower { display: flex; gap: 3px; align-items: flex-end; height: 18px; }
.foe .tower i { width: 6px; background: var(--bronze-dim); border-radius: 2px; }
.status { font-size: 12px; }

/* faixa de turno */
.turnbar { margin: 0 16px; padding: 7px 10px; border-radius: 8px; background: var(--felt-2); border: 1px solid var(--line); font-size: 13px; display: flex; gap: 8px; align-items: center; min-height: 34px; }
.turnbar b { color: var(--bronze); }
.turnbar.mine { border-color: var(--bronze); }

/* mesa */
.table { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 10px; }
.sectionlbl { font-family: var(--f-display); font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.herd { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; align-items: flex-start; }
.empty-herd { color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 10px; padding: 14px; line-height: 1.4; }
.giraffe { flex: 0 0 auto; width: 92px; display: flex; flex-direction: column; align-items: stretch; position: relative; }
.giraffe .piece { border-radius: 6px; background-size: cover; background-position: center; box-shadow: 0 1px 0 rgba(0,0,0,.4); }
.giraffe .head { aspect-ratio: 400/611; background-position: center 30%; }
/* pescoço: faixa de cima da carta, com o ícone da cor e os pontos de defesa impressos */
.giraffe .neck { aspect-ratio: 400/611; margin-top: 2px; background-size: cover; background-position: center; position: relative; }
.giraffe .piece .hpbadge { top: 4px; right: 4px; }
/* pilha: cada carta abaixo de um pescoço cobre a descrição dele (fica à mostra cor, defesa e nome) */
.giraffe .neck + .neck, .giraffe .neck + .body { margin-top: -56%; box-shadow: 0 -3px 6px rgba(0,0,0,.45); }
.giraffe .piece { transition: margin-top .35s cubic-bezier(.2,.8,.3,1); }
.giraffe.open .neck + .neck, .giraffe.open .neck + .body { margin-top: 4px; }
.giraffe { cursor: pointer; }
.giraffe .cap b { text-decoration: underline dotted var(--bronze-dim); text-underline-offset: 3px; }
.giraffe[role=button] { cursor: pointer; }
.giraffe[role=button]:focus-visible { outline: 2px solid var(--bronze); outline-offset: 3px; border-radius: 8px; }
.grid-cards.gfull { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.grid-cards.gfull .gf { display: grid; gap: 4px; }
.grid-cards.gfull .card { width: 100%; }
.grid-cards.gfull .hpbadge { top: 6px; right: 6px; }
.venom { position: absolute; top: 22%; right: -4px; width: 44%; aspect-ratio: 400/611; z-index: 3; pointer-events: none; }
.venom .vcard { position: absolute; inset: 0; background-size: cover; background-position: center; border-radius: 5.4% / 3.5%; transform: translate(calc(var(--i) * -6px), calc(var(--i) * 6px)) rotate(8deg); box-shadow: 0 0 0 2px var(--c-G), 0 4px 10px rgba(0,0,0,.6), 0 0 14px rgba(69,161,97,.6); }
.venom b { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); background: #1f4a2a; color: #d9ffd9; border: 1px solid var(--c-G); font-size: 10px; border-radius: 8px; padding: 1px 5px; white-space: nowrap; }
.hpbadge.wound { background: #2f7a45; }
/* celular: girafas menores para ver a mesa inteira */
@media (max-width: 700px) {
  .giraffe { width: 62px; }
  .herd { gap: 10px; }
  .giraffe .cap { font-size: 10px; } .giraffe .cap b { font-size: 11px; }
  .giraffe .neck + .neck, .giraffe .neck + .body { margin-top: -62%; }
}
/* rodapé com 4 montes: cartas um pouco menores para caber no celular */
.dock .deck { width: 48px; }
.dock .card.sm { --card-w: 48px; }
.dock .deck b { font-size: 12px; }
.dock .vgroup .mini-lbl { width: 0; min-width: 100%; white-space: normal; line-height: 1.15; font-size: 9px; letter-spacing: .04em; }
.dock .row { gap: 6px; }
.deck.objpile { background: url(img/card_back_1.webp) center/cover no-repeat; border-color: transparent; border-radius: 5.4% / 3.5%; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.deck.objpile span { background: rgba(20,12,9,.8); border-radius: 8px; padding: 3px 5px; font-size: 10px; }
.objopt { display: grid; gap: 4px; background: var(--felt-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: left; align-content: start; }
.objopt .card { width: 100%; pointer-events: none; }
.objopt b { font-size: 13px; color: var(--bone); }
.objopt small { font-size: 12px; color: var(--muted); line-height: 1.35; }
.objopt em { font-style: normal; color: var(--bronze); font-weight: 700; font-size: 13px; }
.objopt:hover, .objopt:focus-visible { border-color: #e3b53b; box-shadow: 0 0 0 1px #e3b53b; }
.banner.intro { pointer-events: auto; animation: none; width: min(92vw, 420px); }
.banner.intro .b2 { text-align: left; font-size: 13px; }
.banner.intro .btn { margin-top: 10px; width: 100%; }
.banner.intro.out { animation: fade .3s forwards; }
.portalgrid .card.combo { box-shadow: 0 0 0 2px var(--good); }
.portalgrid .card.combo .tag { background: rgba(40,80,45,.92); }
.pairs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.pairbtn { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 128px; padding: 6px; background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; text-align: center; }
.pairbtn .card { width: 100%; pointer-events: none; }
.pairbtn small { grid-column: 1 / -1; font-size: 11px; color: var(--bone); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pairbtn:hover, .pairbtn:focus-visible { border-color: var(--bronze); }
.grid-cards.pieces { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.giraffe .piece { position: relative; }
.pips { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); display: flex; gap: 1px; pointer-events: none; background: rgba(20,12,9,.55); border-radius: 10px; padding: 1px 2px; }
.piece.head .pips { top: auto; bottom: 14px; right: 4px; transform: none; }
.pips.inl { background: none; padding: 0; border-radius: 0; }
.pips i { width: 17px; height: 17px; background: url(img/def.webp) center/contain no-repeat; filter: drop-shadow(0 1px 2px rgba(0,0,0,.75)); transition: filter .3s, opacity .3s; }
.pips i.lost { filter: grayscale(1) brightness(.4); opacity: .6; }
.pips.inl { position: static; transform: none; display: inline-flex; vertical-align: -.3em; gap: 0; }
.pips.inl i { width: 1.3em; height: 1.3em; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
.pips.inl i.lost { filter: grayscale(1) brightness(.45); opacity: .55; }
.cico { display: inline-block; width: 1.3em; height: 1.3em; vertical-align: -.32em; margin-right: 3px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
.card .tag .cico { width: 13px; height: 13px; vertical-align: -3px; margin-right: 2px; }
.giraffe .body { aspect-ratio: 400/611; background-size: cover; background-position: center; margin-top: 2px; }
.giraffe .cap { font-size: 11px; text-align: center; margin-top: 4px; color: var(--muted); line-height: 1.2; }
.giraffe .cap b { color: var(--bone); font-weight: 600; display: block; font-size: 12px; }
.hpbadge { position: absolute; top: -6px; right: -6px; background: var(--ember); color: #fff; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 1px 6px; font-variant-numeric: tabular-nums; z-index: 2; }
.ticker { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
.ticker div:last-child { color: var(--bone); }

/* rodapé */
.dock { border-top: 1px solid var(--line); background: var(--felt-2); padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.row { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; align-items: flex-end; }
.card { flex: 0 0 auto; width: var(--card-w); aspect-ratio: 400/611; border-radius: 5.4% / 3.5%; background-size: cover; background-position: center; border: 1px solid rgba(0,0,0,.4); position: relative; padding: 0; }
.card.sm { --card-w: 54px; }
.card.lift { transform: translateY(-6px); box-shadow: 0 6px 14px rgba(0,0,0,.5); }
.card .tag { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(20,12,9,.82); font-size: 10px; padding: 2px 3px; border-radius: 0 0 6px 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deck { flex: 0 0 auto; width: 54px; aspect-ratio: 400/611; border-radius: 6px; border: 1px solid var(--bronze-dim); display: grid; place-items: center; text-align: center; font-size: 11px; line-height: 1.2;
  background: repeating-linear-gradient(45deg, #3a261d 0 6px, #2c1c15 6px 12px); }
.deck.pile { background: url(img/card_back.webp) center/cover no-repeat; border-color: transparent; border-radius: 5.4% / 3.5%; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.deck.pile span { background: rgba(20,12,9,.8); border-radius: 8px; padding: 3px 7px; }
.deck.pile.go { box-shadow: 0 0 0 2px var(--bronze), 0 0 14px rgba(200,145,63,.5); }
.deck b { font-family: var(--f-display); font-size: 13px; color: var(--bronze); display: block; }
.deck.go { border-color: var(--bronze); box-shadow: 0 0 0 2px rgba(200,145,63,.35); }
.mini-lbl { font-size: 10px; color: var(--muted); text-align: center; letter-spacing: .08em; text-transform: uppercase; }
.vgroup { display: grid; gap: 3px; flex: 0 0 auto; }
.sep { width: 1px; align-self: stretch; background: var(--line); flex: 0 0 auto; }

/* folhas e modais */
.scrim { position: fixed; inset: 0; background: rgba(8,5,4,.72); display: flex; align-items: flex-end; justify-content: center; z-index: 85; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.sheet h2 { font-size: 16px; margin: 0; }
.sheet p { margin: 0; line-height: 1.45; color: var(--muted); }
.sheet .big { width: min(230px, 62vw); aspect-ratio: 400/611; border-radius: 5.4% / 3.5%; background-size: cover; background-position: center; justify-self: center; }
.kind { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--bronze); font-weight: 700; }
.btns { display: grid; gap: 8px; }
.btn { background: var(--bronze); color: #1d1411; border: 0; border-radius: 10px; padding: 12px 14px; font-weight: 700; font-size: 15px; text-align: left; display: flex; justify-content: space-between; gap: 8px; }
.btn.ghost { background: transparent; color: var(--bone); border: 1px solid var(--line); }
.btn.ghost.sel { border-color: var(--bronze); color: var(--bronze); }
.btn small { font-weight: 500; opacity: .8; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.grid-cards .card { width: 100%; }
.objs { display: grid; gap: 10px; }
.obj { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.obj .card { --card-w: 56px; }
.obj h3 { font-size: 12px; margin: 0 0 3px; }
.obj p { font-size: 14px; color: var(--bone); }
.obj .pts { color: var(--bronze); font-weight: 700; font-size: 13px; }
.loglist { font-size: 14px; line-height: 1.45; display: grid; gap: 4px; max-height: 60vh; overflow-y: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(210px + env(safe-area-inset-bottom, 0px)); background: var(--ember); color: #fff; padding: 9px 14px; border-radius: 10px; font-weight: 600; z-index: 95; max-width: 88%; text-align: center; }

/* tela inicial */
.setup { flex: 1; overflow-y: auto; padding: 24px 16px; display: grid; gap: 18px; align-content: start; }
.setup h1 { font-size: 26px; margin: 0; color: var(--bronze); line-height: 1.2; }
.setup h1.brand { margin: -4px 0 -6px; }
.setup h1.brand img { display: block; width: min(100%, 440px); height: auto; margin: 0 auto; filter: drop-shadow(0 6px 18px rgba(0,0,0,.55)); }
.field input.err { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember); }
.field input.shake { animation: shake .45s; }
.fielderr { margin: 0; color: var(--ember); font-size: 13px; font-weight: 600; }
.field input::placeholder { color: var(--muted); opacity: .8; }
.setup .lede { color: var(--muted); line-height: 1.5; margin: 0; max-width: 60ch; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field input { background: var(--felt-2); border: 1px solid var(--line); color: var(--bone); border-radius: 10px; padding: 12px; font: inherit; font-size: 16px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 44px; background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.seg button.on { background: var(--bronze); color: #1d1411; border-color: var(--bronze); }
.heroes { display: flex; gap: 8px; overflow: hidden; }
.heroes .card { --card-w: 62px; }
.note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--bronze-dim); padding-left: 10px; line-height: 1.45; }
.rules { display: grid; gap: 8px; font-size: 14px; line-height: 1.45; }
.rules b { color: var(--bronze); }


.narr { display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--felt-2); border: 1px solid var(--line); }
.narr .nl { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: 13px; line-height: 1.4; color: var(--muted); }
.narr .nl.now { color: var(--bone); font-size: 15px; animation: capin .4s; }
.narr .nl b { color: var(--bronze); font-weight: 600; }
.narr .ni { text-align: center; }
.stage .cap .expl { margin: 8px auto 0; max-width: 34ch; font-size: 14.5px; line-height: 1.45; color: var(--bone); background: rgba(29,20,17,.88); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; text-shadow: none; text-align: left; }
.stage .cap .expl b { color: var(--bronze); }
.stage .cap .tap { margin-top: 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .35; } }
body.can-skip .fx, body.can-skip .stage { cursor: pointer; }
/* janela de destaque: bloqueia toques acidentais na mesa e na mão por trás */
body.popup .fx, .stage.on { pointer-events: auto; cursor: default; touch-action: none; }
body.popup .app > .top, body.popup .app > .dock { pointer-events: none; }
.banner .b2 small { color: var(--muted); font-size: 13px; }
.card.nobuy { filter: grayscale(.85) brightness(.55); }
.card.canbuy { box-shadow: 0 0 0 2px var(--good); }
.card.canbuy .tag { font-size: 9px; background: rgba(40,80,45,.9); }

.online { display: grid; gap: 8px; padding-top: 6px; border-top: 1px solid var(--line); }
.seatlist { display: grid; gap: 6px; }
.seat { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.seat small { color: var(--muted); font-weight: 500; }
.seat.bot { opacity: .75; border-style: dashed; }
.waiting { display: flex; gap: 10px; align-items: center; color: var(--muted); padding: 8px 0; }
.netpill { margin-left: auto; font-size: 13px; }
.seg button[disabled] { opacity: .35; }
/* ---------- animações ---------- */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 81; overflow: hidden; }
.fly { position: fixed; left: 0; top: 0; transform-origin: 0 0; perspective: 800px; will-change: transform; }
.fly .face { position: absolute; inset: 0; border-radius: 5.4% / 3.5%; background-size: cover; background-position: center; backface-visibility: hidden; transition: transform .35s ease; box-shadow: 0 10px 30px rgba(0,0,0,.55); }
.fly .back { transform: rotateY(180deg); background: url(img/card_back.webp) center/cover no-repeat; }
.fly.flipped .front { transform: rotateY(-180deg); }
.fly.flipped .back { transform: rotateY(0deg); }
.fly.onstage .face { box-shadow: 0 0 0 2px var(--bronze), 0 18px 50px rgba(0,0,0,.7), 0 0 60px rgba(200,145,63,.35); }
.stage { position: fixed; inset: 0; z-index: 80; pointer-events: none; background: rgba(10,6,5,.0); transition: background .3s; }
.stage.on { background: rgba(10,6,5,.72); }
/* espiar a mesa: tocar na sua mesa, mão ou adversários deixa a carta em destaque transparente por alguns segundos */
body.can-skip .fx .banner.gold { pointer-events: auto; }
.banner .tap, .stage .cap .tap { margin-top: 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); animation: blink 1.6s infinite; }
.stage .cap.boomcap b { color: var(--ember); }
body:not(.can-skip) .tap { visibility: hidden; }
.stage .cap { position: absolute; left: 16px; right: 16px; text-align: center; font-size: 16px; line-height: 1.35; text-shadow: 0 2px 8px #000; opacity: 0; animation: capin .35s .2s forwards; }
.stage .cap b { color: var(--bronze); }
.stage .cap .kd { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
@keyframes capin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.stamp { position: fixed; transform: translate(-50%,-50%) rotate(-14deg) scale(2); font-family: var(--f-display); font-size: 22px; padding: 6px 12px; border: 3px solid; border-radius: 8px; z-index: 75; opacity: 0; animation: stampin .35s cubic-bezier(.2,1.6,.4,1) forwards; background: rgba(20,10,8,.8); }
.stamp.no { color: var(--ember); border-color: var(--ember); }

/* ---------- tela de apresentação ---------- */

.splash { --cw: clamp(80px, 9vw, 150px); }
.fcard { position: absolute; top: var(--y); width: calc(var(--cw) * var(--s)); aspect-ratio: 400/611; transform: rotate(var(--r)); animation: fin .9s cubic-bezier(.2,1.2,.4,1) calc(var(--d) * .3) both; }

/* fundo da tela de entrada (apelido / nova partida / sala de espera) */

@keyframes rumble { 0%,100% { translate: 0 0; } 25% { translate: calc(var(--p, 0) * 7px) calc(var(--p, 0) * -4px); } 75% { translate: calc(var(--p, 0) * -6px) calc(var(--p, 0) * 5px); } }

/* mão: todas as cartas inteiras, em linhas, sem cortar nem desalinhar */

  body { font-size: 16px; }
  .app { max-width: 1480px; }
  .app:has(> .dock) {
    display: grid; column-gap: 20px;
    grid-template-columns: minmax(0, 1fr) 380px;
    grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
    grid-template-areas: "top top" "foes foes" "turn side" "head side" "herd side" "dock dock";
  }

  .app:has(> .dock) .table { display: contents; }

  .narr .nl { font-size: 14px; } .narr .nl.now { font-size: 16px; }
  /* montes sobre a mesa, centralizados, e a mão logo abaixo — sem painel */
  .dock { grid-area: dock; grid-template-columns: minmax(0, 1fr); justify-items: center; row-gap: 14px; padding: 8px 0 14px; background: none; border-top: 0; }

  #hand .card .tag { font-size: 12px; }
  .toast { bottom: 240px; }
  /* janelas: centralizadas e mais largas */
  .scrim { align-items: center; }
  .sheet { max-width: 760px; max-height: 88%; border-radius: 16px; border-bottom: 1px solid var(--line); padding: 22px 24px; }
  .sheet h2 { font-size: 19px; }
